name: One-shot Rustfmt Repair
on:
  push:
    branches: ["feat/local-first-licensing-v1"]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-first-licensing-v1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Format exact Rust workspace
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml
      - name: Commit formatting only when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri
          git commit -m "style: apply pinned rustfmt 1.98.1"
          git push origin HEAD:feat/local-first-licensing-v1
