name: Release Candidate Installers

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm icons
      - run: pnpm tauri build --bundles nsis
      - name: Verify Windows installer, architecture and launch
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($files.Count -lt 1) { throw "NSIS installer missing" }
          $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List }
          $installer = $files[0].FullName
          $installDir = Join-Path $env:RUNNER_TEMP "kmj-commander-smoke"
          $install = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent install failed: $($install.ExitCode)" }
          $binary = Get-ChildItem $installDir -Recurse -Filter "kmj-desktop-commander.exe" | Select-Object -First 1
          if (-not $binary) { throw "Installed executable missing" }
          $headers = & dumpbin /headers $binary.FullName | Out-String
          if ($headers -notmatch "machine \(x64\)") { throw "Installed executable is not x64" }
          $app = Start-Process -FilePath $binary.FullName -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited) { throw "Commander exited during Windows launch smoke test: $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          Write-Host "WINDOWS_LAUNCH_SMOKE=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: kmj-desktop-commander-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm icons
      - run: pnpm tauri build --bundles appimage,deb
      - name: Verify Linux packages, architecture and launch
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          deb="$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          test -n "$appimage"
          test -n "$deb"
          sha256sum "$appimage" "$deb"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"
          chmod +x "$appimage"
          set +e
          xvfb-run -a timeout 8s "$appimage" --no-sandbox
          rc=$?
          set -e
          if [ "$rc" -ne 124 ]; then
            echo "AppImage launch smoke failed with exit $rc"
            exit 1
          fi
          echo "LINUX_LAUNCH_SMOKE=PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: kmj-desktop-commander-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
