name: Cross Platform Packages

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: nsis
            artifact: windows
            path: src-tauri/target/release/bundle/nsis/*
          - os: ubuntu-latest
            bundle: appimage,deb
            artifact: linux
            path: |
              src-tauri/target/release/bundle/appimage/*
              src-tauri/target/release/bundle/deb/*
          - os: macos-latest
            bundle: app
            artifact: macos
            path: src-tauri/target/release/bundle/macos/*

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm tauri build --bundles ${{ matrix.bundle }}
      - uses: actions/upload-artifact@v4
        with:
          name: kmj-desktop-commander-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 14
