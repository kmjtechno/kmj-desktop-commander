name: Cross Platform Installers

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows-x64
            artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: appimage,deb
            artifact: linux-x64
            artifact_path: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: macos-arm64
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: macos-intel
            artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - name: Build installer
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          if ($files.Count -lt 1) { throw "NSIS installer missing" }
          $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List }
      - name: Verify Linux installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          file src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          file src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          sha256sum src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
      - name: Verify macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          file src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          shasum -a 256 src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: kmj-desktop-commander-${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
