[package]
name = "kmj-desktop-commander"
version = "0.1.0"
description = "Security-first engineering control plane by KMJ TECHNO"
authors = ["KMJ TECHNO"]
edition = "2024"
rust-version = "1.98.1"

[lib]
name = "kmj_desktop_commander_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
