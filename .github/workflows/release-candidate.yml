name: Release Candidate Installers

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm icons
      - run: pnpm tauri build --bundles nsis
      - shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe"
          if ($files.Count -lt 1) { throw "NSIS installer missing" }
          $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List }
      - uses: actions/upload-artifact@v4
        with:
          name: kmj-desktop-commander-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm icons
      - run: pnpm tauri build --bundles appimage,deb
      - shell: bash
        run: |
          set -euo pipefail
          test -n "$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)"
          test -n "$(find src-tauri/target/release/bundle/deb -name '*.deb' -print -quit)"
          sha256sum src-tauri/target/release/bundle/appimage/*.AppImage src-tauri/target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: kmj-desktop-commander-linux-x64
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
