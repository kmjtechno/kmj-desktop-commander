[package]
name = "kmj-commander-headless"
version = "0.3.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
uuid = { version = "1", features = ["v4"] }
