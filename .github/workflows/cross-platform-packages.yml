name: Cross Platform Installers

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: windows-x64
            artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bundle: appimage,deb
            artifact: linux-x64
            artifact_path: |
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: macos-arm64
            artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: macos-intel
            artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - name: Generate platform icon set
        run: pnpm tauri icon src-tauri/icons/commander.svg
      - name: Build installer
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Verify Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe"
          if ($files.Count -lt 1) { throw "NSIS installer missing" }
          $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 | Format-List }
          $installer = $files[0].FullName
          $installDir = Join-Path $env:RUNNER_TEMP "kmj-commander-smoke"
          $process = Start-Process -FilePath $installer -ArgumentList "/S", "/D=$installDir" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Silent install failed with exit code $($process.ExitCode)" }
          $binary = Get-ChildItem $installDir -Recurse -Filter "kmj-desktop-commander.exe" | Select-Object -First 1
          if (-not $binary) { throw "Installed Commander executable missing" }
          $uninstaller = Get-ChildItem $installDir -Recurse -Filter "Uninstall.exe" | Select-Object -First 1
          if ($uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Silent uninstall failed with exit code $($uninstall.ExitCode)" }
          }
      - name: Verify Linux installers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find "src-tauri/target/${{ matrix.target }}/release/bundle/appimage" -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find "src-tauri/target/${{ matrix.target }}/release/bundle/deb" -maxdepth 1 -name '*.deb' -print -quit)"
          chmod +x src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          rm -rf squashfs-root
          src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage --appimage-extract >/dev/null
          test -d squashfs-root
          dpkg-deb --info src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb >/dev/null
          file src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          file src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          sha256sum src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
      - name: Verify macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          dmg="$(find "src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          hdiutil verify "$dmg"
          mountpoint="$RUNNER_TEMP/kmj-dmg"
          mkdir -p "$mountpoint"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mountpoint"
          test -d "$mountpoint/KMJ Desktop Commander.app"
          hdiutil detach "$mountpoint"
          shasum -a 256 "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: kmj-desktop-commander-${{ matrix.artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kmj-desktop-commander-*
          path: release-assets
          merge-multiple: false
      - name: Build SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "KMJ Desktop Commander $GITHUB_REF_NAME" \
            --notes "Verified installer prerelease for Windows x64, Linux x64, macOS Apple Silicon and macOS Intel. SHA-256 checksums are attached. This remains a prerelease until platform code signing/notarization is enabled." \
            "${files[@]}" SHA256SUMS.txt
