name: Approve Performance Baseline Refresh

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Successful Performance Baseline Candidate workflow run ID"
        required: true
        type: string
      approval_reason:
        description: "Human review/approval reason"
        required: true
        type: string
      approval:
        description: "Type APPROVE BASELINE REFRESH"
        required: true
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  approve:
    runs-on: ubuntu-24.04
    environment: performance-baseline-approval
    steps:
      - name: Require explicit approval phrase
        env:
          APPROVAL: ${{ inputs.approval }}
        run: test "$APPROVAL" = "APPROVE BASELINE REFRESH"
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate successful candidate run
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "candidate_run_id must be numeric"; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" > /tmp/run.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open("/tmp/run.json"))
          if r.get("conclusion")!="success": raise SystemExit("candidate run is not successful")
          if r.get("event")!="workflow_dispatch": raise SystemExit("candidate run was not manually requested")
          if r.get("path")!=".github/workflows/performance-baseline-candidate.yml": raise SystemExit("wrong source workflow")
          print("run_url="+r["html_url"])
          print("run_actor="+r["actor"]["login"])
          PY
      - name: Download and verify sealed candidate evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          mkdir -p /tmp/baseline-evidence
          gh run download "$RUN_ID" -n "baseline-refresh-candidate-$RUN_ID" -D /tmp/baseline-evidence
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess
          root=pathlib.Path("/tmp/baseline-evidence")
          seal=json.load(open(root/"evidence-sha256.json"))["sha256"]
          for name,want in seal.items():
              got=hashlib.sha256((root/name).read_bytes()).hexdigest()
              if got!=want: raise SystemExit(f"evidence hash mismatch: {name}")
          req=json.load(open(root/"request.json"))
          sha=req["candidate_sha"]
          subprocess.run(["git","fetch","origin","main","--no-tags"],check=True)
          subprocess.run(["git","merge-base","--is-ancestor",sha,"origin/main"],check=True)
          pathlib.Path("/tmp/candidate_sha").write_text(sha)
          PY
      - name: Create auditable baseline refresh branch
        env:
          APPROVAL_REASON: ${{ inputs.approval_reason }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_URL: ${{ steps.verify.outputs.run_url }}
          CANDIDATE_RUN_ACTOR: ${{ steps.verify.outputs.run_actor }}
        run: |
          CANDIDATE_SHA="$(cat /tmp/candidate_sha)"
          SHORT="${CANDIDATE_SHA:0:12}"
          BRANCH="perf/baseline-refresh-$SHORT-$CANDIDATE_RUN_ID"
          git checkout -b "$BRANCH"
          python3 - <<'PY'
          import datetime,json,os,pathlib
          manifest_path=pathlib.Path(".github/performance-baseline.json")
          manifest=json.loads(manifest_path.read_text())
          previous=manifest["baseline_commit"]
          new=pathlib.Path("/tmp/candidate_sha").read_text().strip()
          if previous==new: raise SystemExit("candidate is already the pinned baseline")
          manifest["baseline_commit"]=new
          manifest_path.write_text(json.dumps(manifest,indent=2)+"\n")
          ev=pathlib.Path("/tmp/baseline-evidence")
          now=datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat()
          audit={"schema":1,"changed_at_utc":now,"previous_baseline_commit":previous,"new_baseline_commit":new,"candidate_run_id":int(os.environ["CANDIDATE_RUN_ID"]),"candidate_run_url":os.environ["CANDIDATE_RUN_URL"],"candidate_requested_by":os.environ["CANDIDATE_RUN_ACTOR"],"approved_by":os.environ["GITHUB_ACTOR"],"approval_run_id":int(os.environ["GITHUB_RUN_ID"]),"approval_reason":os.environ["APPROVAL_REASON"],"evidence_sha256":json.load(open(ev/"evidence-sha256.json"))["sha256"],"accepted_metrics":json.load(open(ev/"metrics.json"))}
          out=pathlib.Path(".github/performance-baseline-history");out.mkdir(parents=True,exist_ok=True)
          audit_path=out/(now.replace(":","-")+"-"+new[:12]+".json")
          audit_path.write_text(json.dumps(audit,indent=2)+"\n")
          pathlib.Path("/tmp/baseline-change-audit.json").write_text(json.dumps(audit,indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/performance-baseline.json .github/performance-baseline-history/
          git commit -m "perf: propose reviewed baseline refresh to $SHORT"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
      - name: Upload auditable baseline-change artifact
        uses: actions/upload-artifact@v4
        with:
          name: baseline-change-audit-${{ github.run_id }}
          path: |
            /tmp/baseline-change-audit.json
            /tmp/baseline-evidence/evidence-sha256.json
            /tmp/baseline-evidence/metrics.json
            /tmp/baseline-evidence/environment.json
          if-no-files-found: error
          retention-days: 90
      - name: Open review-required baseline change PR
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          APPROVAL_REASON: ${{ inputs.approval_reason }}
        run: |
          CANDIDATE_SHA="$(cat /tmp/candidate_sha)"
          cat > /tmp/pr-body.md <<EOF
          Baseline refresh proposal generated only after successful benchmark run #$CANDIDATE_RUN_ID and explicit approval by @$GITHUB_ACTOR.

          Approval reason: $APPROVAL_REASON

          The committed audit record contains the previous/new baseline SHA, source run, approver, accepted metrics, and SHA-256 hashes of measured evidence. Merge only after normal repository review and required checks pass.
          EOF
          gh pr create --base main --head "$BRANCH" \
            --title "perf: refresh pinned baseline to ${CANDIDATE_SHA:0:12}" \
            --body-file /tmp/pr-body.md
